name: Update Bypass List for All Repos

on:
  workflow_dispatch:

jobs:
  update-bypass-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Update bypass list for all repos
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          repos=$(curl -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/allegis-is/repos | jq -r '.[] | select(.name | startswith("mule-")) | .name')

          for repo in $repos; do
            curl -L \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Vishal-poc/$repo/rulesets/3366708 \
              -d '{
                "bypass_actors": [
                  {
                    "actor_id": 12757998,
                    "actor_type": "Team",
                    "bypass_mode": "always"
                  }
                ]
              }'
          done
